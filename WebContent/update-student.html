
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تعديل بيانات الطالب</title>

    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="brand">
                <h3 data-ar="نظام إدارة الطلاب والمقررات"
                    data-en="Student & Course Management System">
                    نظام إدارة الطلاب والمقررات
                </h3>

                <span data-ar="تعديل بيانات الطالب"
                      data-en="Edit Student">
                    تعديل بيانات الطالب
                </span>
            </div>

            <button id="languageBtn" class="language-btn">
                English
            </button>
        </div>
    </header>

    <!-- Page Header -->
    <section class="page-header">
        <div class="page-header-content">
            <div>
                <span data-ar="إدارة النظام"
                      data-en="System Management">
                    إدارة النظام
                </span>

                <h1 data-ar="تعديل بيانات الطالب"
                    data-en="Edit Student">
                    تعديل بيانات الطالب
                </h1>

                <p data-ar="تحديث المعلومات المسجلة للطالب."
                   data-en="Update the student's registered information.">
                    تحديث المعلومات المسجلة للطالب.
                </p>
            </div>

            <a href="students.html" class="back-button">
                <span data-ar="العودة للطلاب"
                      data-en="Back to Students">
                    العودة للطلاب
                </span>
            </a>
        </div>
    </section>

    <!-- Edit Student Form -->
    <main class="students-container">

        <section class="content-card">

            <div class="section-title">
                <div>
                    <h2 data-ar="معلومات الطالب"
                        data-en="Student Information">
                        معلومات الطالب
                    </h2>

                    <span data-ar="عدّلي البيانات المطلوبة ثم اضغطي تحديث"
                          data-en="Edit the required information and click Update">
                        عدّلي البيانات المطلوبة ثم اضغطي تحديث
                    </span>
                </div>
            </div>

            <!--
                نرسل البيانات إلى UpdateStudentServlet
                باستخدام POST عند ربط الـ Servlet في web.xml
            -->
            <form id="editStudentForm"
                  action="updateStudent"
                  method="post">

                <!-- رقم الهوية لتحديد الطالب المراد تعديله -->
                <input type="hidden"
                       id="originalNationalId"
                       name="originalNationalId">

                <div class="form-group">
                    <label for="studentName"
                           data-ar="اسم الطالب"
                           data-en="Student Name">
                        اسم الطالب
                    </label>

                    <input type="text"
                           id="studentName"
                           name="name"
                           required>
                </div>

                <div class="form-group">
                    <label for="nationalId"
                           data-ar="رقم الهوية الوطنية"
                           data-en="National ID">
                        رقم الهوية الوطنية
                    </label>

                    <input type="text"
                           id="nationalId"
                           name="nationalId"
                           maxlength="10"
                           inputmode="numeric"
                           pattern="[12][0-9]{9}"
                           required>
                </div>

                <div class="form-group">
                    <label for="studentAge"
                           data-ar="العمر"
                           data-en="Age">
                        العمر
                    </label>

                    <input type="number"
                           id="studentAge"
                           name="age"
                           min="1"
                           required>
                </div>

                <div class="form-group">
                    <label for="studentGrade"
                           data-ar="الدرجة"
                           data-en="Grade">
                        الدرجة
                    </label>

                    <input type="number"
                           id="studentGrade"
                           name="grade"
                           min="0"
                           max="100"
                           step="0.01"
                           required>
                </div>

                <div class="form-actions">

                    <button type="submit"
                            class="primary-button">
                        <span data-ar="تحديث البيانات"
                              data-en="Update Student">
                            تحديث البيانات
                        </span>
                    </button>

                    <a href="students.html"
                       class="back-button">
                        <span data-ar="إلغاء"
                              data-en="Cancel">
                            إلغاء
                        </span>
                    </a>

                </div>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">
        <span data-ar="نظام إدارة الطلاب والمقررات © 2026"
              data-en="Student & Course Management System © 2026">
            نظام إدارة الطلاب والمقررات © 2026
        </span>
    </footer>

    <!-- Language -->
    <script src="js/language.js?v=2"></script>

    <!-- Fill the form using the selected student's URL parameters -->
    <script>
        const params = new URLSearchParams(
            window.location.search
        );

        document.getElementById("originalNationalId").value =
            params.get("nationalId") || "";

        document.getElementById("studentName").value =
            params.get("name") || "";

        document.getElementById("nationalId").value =
            params.get("nationalId") || "";

        document.getElementById("studentAge").value =
            params.get("age") || "";

        document.getElementById("studentGrade").value =
            params.get("grade") || "";
    </script>

</body>
</html>


<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة الطلاب والمقررات</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="header-container">

            <div class="brand">
                <h3 data-ar="نظام إدارة الطلاب والمقررات"
                    data-en="Student & Course Management System">
                    نظام إدارة الطلاب والمقررات
                </h3>

                <span data-ar="بوابة الإدارة"
                      data-en="Management Portal">
                    بوابة الإدارة
                </span>
            </div>

            <button id="languageBtn" class="language-btn">
                English
            </button>

        </div>

    </header>


    <!-- Hero -->
    <section class="hero">

        <div class="hero-content">

            <div class="hero-text">

                <span data-ar="منصة إدارة أكاديمية"
                      data-en="Academic Management Platform">
                    منصة إدارة أكاديمية
                </span>

                <h1 data-ar="نظام إدارة الطلاب والمقررات"
                    data-en="Student & Course Management System">
                    نظام إدارة الطلاب والمقررات
                </h1>

            </div>

        </div>

    </section>


    <!-- Management -->
    <main class="management">

        <div class="cards">

            <!-- Student -->
            <div class="management-card student-card">

                <div class="card-top">

                    <span class="card-number">01</span>

                    <div class="card-icon">

                        <svg viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4
                            1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>

                    </div>

                </div>

                <div class="card-content">

                    <h2 data-ar="إدارة الطلاب"
                        data-en="Student Management">
                        إدارة الطلاب
                    </h2>

                    <p data-ar="إدارة بيانات الطلاب وسجلاتهم بسهولة."
                       data-en="Manage student information and records easily.">
                        إدارة بيانات الطلاب وسجلاتهم بسهولة.
                    </p>

                </div>

                <a href="students.html" class="card-button student-button">

                    <span data-ar="إدارة الطلاب"
                          data-en="Manage Students">
                        إدارة الطلاب
                    </span>

                    <span class="arrow">←</span>

                </a>

            </div>


            <!-- Course -->
            <div class="management-card course-card">

                <div class="card-top">

                    <span class="card-number">02</span>

                    <div class="card-icon">

                        <svg viewBox="0 0 24 24">
                            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
                            <path d="M5 13.18V17c0 1.1 3.13 3 7 3s7-1.9 7-3v-3.82L12 17l-7-3.82z"/>
                        </svg>

                    </div>

                </div>

                <div class="card-content">

                    <h2 data-ar="إدارة المقررات"
                        data-en="Course Management">
                        إدارة المقررات
                    </h2>

                    <p data-ar="إدارة بيانات المقررات وتنظيم سجلاتها بسهولة."
                       data-en="Manage course information and organize course records easily.">
                        إدارة بيانات المقررات وتنظيم سجلاتها بسهولة.
                    </p>

                </div>

                <a href="courses.html" class="card-button course-button">

                    <span data-ar="إدارة المقررات"
                          data-en="Manage Courses">
                        إدارة المقررات
                    </span>

                    <span class="arrow">←</span>

                </a>

            </div>

        </div>

    </main>


    <footer class="footer">

        <span data-ar="نظام إدارة الطلاب والمقررات © 2026"
              data-en="Student & Course Management System © 2026">
            نظام إدارة الطلاب والمقررات © 2026
        </span>

    </footer>


 <script src="js/language.js?v=2"></script>

</body>

</html>
